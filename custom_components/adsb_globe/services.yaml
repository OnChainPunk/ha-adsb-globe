set_options:
  name: Set options
  description: Update alert radius, notifications and alert rules
  fields:
    radius_nm:
      name: Alert radius
      description: Default nautical miles from home
      selector:
        number:
          min: 5
          max: 80
          unit_of_measurement: NM
    notify:
      name: Notifications
      description: Master switch for persistent notifications
      selector:
        boolean:
    rules:
      name: Alert rules
      description: JSON list of alert rules (match, radius, ring, message)
