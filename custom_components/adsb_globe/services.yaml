set_options:
  name: Set options
  description: Update alert radius, notifications, panel size and alert rules
  fields:
    radius_nm:
      name: Alert radius
      description: Default nautical miles from home
      selector:
        number:
          min: 5
          max: 80
          unit_of_measurement: NM
    notify:
      name: Notifications
      description: Master switch for alert actions
      selector:
        boolean:
    panel_size:
      name: Details panel size
      description: 1 compact through 5 large
      selector:
        number:
          min: 1
          max: 5
    rules:
      name: Alert rules
      description: JSON list of alert rules (match, radius, ring, title, message, notify, notify_service, tts)
