set_options:
  name: Set options
  description: Update alerts, panel layout, data sources and quick types
  fields:
    radius_nm:
      name: Alert radius
      selector:
        number:
          min: 5
          max: 80
          unit_of_measurement: NM
    notify:
      name: Notifications
      selector:
        boolean:
    panel_size:
      name: Details panel size (legacy 1-5)
      selector:
        number:
          min: 1
          max: 5
    panel:
      name: Panel layout JSON
    sources:
      name: Data source list JSON
    quick_types:
      name: Quick-select type list JSON
    rules:
      name: Alert rules JSON
